openapi: 3.1.0
info:
  title: Identité & Accès (auth-and-identity) API
  description: Endpoints d'identification et de profil utilisateur via Keycloak OIDC.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1

paths:
  /me:
    get:
      summary: Récupérer le profil utilisateur connecté
      description: Retourne le profil interne Nanko associé au compte Keycloak connecté (avec JIT provisioning automatique si premier appel).
      operationId: getMe
      tags:
        - Profil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil utilisateur retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfileResponse:
      type: object
      required:
        - id
        - keycloakId
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "0191c280-496a-7312-bf91-a1b2c3d4e5f6"
        keycloakId:
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "user@nanko.dev"
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Token JWT manquant, invalide ou expiré."

  responses:
    401Unauthorized:
      description: Non authentifié ou token expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
