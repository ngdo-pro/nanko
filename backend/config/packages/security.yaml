security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        health:
            pattern: ^/health$
            security: false

        api:
            pattern: ^/api/
            stateless: true
            entry_point: App\AuthAndIdentity\Adapter\Driver\Http\Security\JwtKeycloakAuthenticator
            custom_authenticators:
                - App\AuthAndIdentity\Adapter\Driver\Http\Security\JwtKeycloakAuthenticator

    access_control:
        - { path: ^/api/v1/me, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
