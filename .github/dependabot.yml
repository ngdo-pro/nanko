version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/landing"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/prod"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/preprod"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/signoz"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/plausible"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
      npm-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
