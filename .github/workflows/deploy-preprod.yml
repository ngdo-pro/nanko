name: Deploy preprod

on:
  push:
    branches: [main]

env:
  ENVIRONMENT: preprod
  VITE_API_BASE_URL: https://api.preprod.nanko.dev
  VITE_KEYCLOAK_URL: https://auth.preprod.nanko.dev

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute SemVer version
        id: semver
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          SEMVER="${BASE_TAG}-rc.${{ github.run_number }}"
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "Calculated SemVer version: ${SEMVER} (${{ github.sha }})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.semver.outputs.version }}
            APP_COMMIT=${{ steps.semver.outputs.commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod-${{ steps.semver.outputs.commit }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod-${{ github.sha }}

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: landing
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod-${{ github.sha }}
