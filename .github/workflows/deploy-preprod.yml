name: Deploy preprod

on:
  push:
    branches: [main]

env:
  ENVIRONMENT: preprod
  VITE_API_BASE_URL: https://api.preprod.nanko.dev

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod-${{ github.sha }}
