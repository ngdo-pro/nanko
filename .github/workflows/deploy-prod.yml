name: Deploy prod

on:
  workflow_dispatch:

env:
  ENVIRONMENT: prod
  VITE_API_BASE_URL: https://api.nanko.dev
  VITE_KEYCLOAK_URL: https://auth.nanko.dev
  VITE_OTEL_EXPORTER_URL: https://otlp.nanko.dev/v1/traces
  VITE_PLAUSIBLE_DOMAIN: nanko.dev
  VITE_PLAUSIBLE_API_HOST: https://plausible.nanko.dev

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute SemVer version
        id: semver
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "version=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "Calculated SemVer version: ${BASE_TAG} (${{ github.sha }})"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.semver.outputs.version }}
            APP_COMMIT=${{ steps.semver.outputs.commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-backend:prod
            ghcr.io/${{ github.repository_owner }}/nanko-backend:prod-${{ steps.semver.outputs.commit }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
            VITE_OTEL_EXPORTER_URL=${{ env.VITE_OTEL_EXPORTER_URL }}
            VITE_APP_ENV=${{ env.ENVIRONMENT }}
            VITE_PLAUSIBLE_DOMAIN=${{ env.VITE_PLAUSIBLE_DOMAIN }}
            VITE_PLAUSIBLE_API_HOST=${{ env.VITE_PLAUSIBLE_API_HOST }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:prod
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:prod-${{ github.sha }}

      - name: Build and push landing image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: landing
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-landing:prod
            ghcr.io/${{ github.repository_owner }}/nanko-landing:prod-${{ github.sha }}
