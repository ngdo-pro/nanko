name: PR Preprod E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preprod-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  ENVIRONMENT: preprod
  VITE_API_BASE_URL: https://api.preprod.nanko.dev
  VITE_KEYCLOAK_URL: https://auth.preprod.nanko.dev
  PREPROD_VERSION_URL: https://api.preprod.nanko.dev/api/v1/version
  APP_BASE_URL: https://app.preprod.nanko.dev

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute SemVer version
        id: semver
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          SEMVER="${BASE_TAG}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "Calculated SemVer version: ${SEMVER} (${COMMIT_SHA})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.semver.outputs.version }}
            APP_COMMIT=${{ steps.semver.outputs.commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod-${{ steps.semver.outputs.commit }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod-${{ steps.semver.outputs.commit }}

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: landing
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod-${{ steps.semver.outputs.commit }}

      - name: Wait for Preprod deployment (Watchtower polling)
        run: |
          EXPECTED_VERSION="${{ steps.semver.outputs.version }}"
          echo "Waiting for preprod (${PREPROD_VERSION_URL}) to serve version: ${EXPECTED_VERSION}"
          TIMEOUT=480
          ELAPSED=0
          INTERVAL=15

          while [ $ELAPSED -lt $TIMEOUT ]; do
            CURRENT_VERSION=$(curl -s --connect-timeout 5 --max-time 10 "${PREPROD_VERSION_URL}" | jq -r '.version // empty' 2>/dev/null || echo "")
            echo "[$(date +'%T')] Current preprod version: '${CURRENT_VERSION}' (expected: '${EXPECTED_VERSION}')"

            if [ "$CURRENT_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "✅ Preprod is successfully deployed with version ${EXPECTED_VERSION}!"
              exit 0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout: Preprod did not update to version ${EXPECTED_VERSION} within ${TIMEOUT} seconds."
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter tests-e2e exec playwright install --with-deps chromium

      - name: Run E2E tests against preprod
        env:
          APP_BASE_URL: ${{ env.APP_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm --filter tests-e2e exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preprod
          path: tests-e2e/playwright-report/
          retention-days: 7
