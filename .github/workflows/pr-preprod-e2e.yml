name: PR Preprod E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preprod-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  ENVIRONMENT: preprod
  VITE_API_BASE_URL: https://api.preprod.nanko.dev
  VITE_KEYCLOAK_URL: https://auth.preprod.nanko.dev
  VITE_OTEL_EXPORTER_URL: https://otlp.nanko.dev/v1/traces
  VITE_PLAUSIBLE_DOMAIN: preprod.nanko.dev
  VITE_PLAUSIBLE_API_HOST: https://plausible.nanko.dev
  PREPROD_VERSION_URL: https://api.preprod.nanko.dev/api/v1/version
  APP_BASE_URL: https://app.preprod.nanko.dev

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for changes requiring Preprod & E2E
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.2
        id: changes
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - 'tests-e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Makefile'

      - name: Skip notice
        if: steps.changes.outputs.app != 'true'
        run: |
          echo "⏭️ No backend, frontend, infra, or E2E changes detected."
          echo "Skipping Docker build, preprod deployment, and Playwright E2E tests."

      - name: Compute SemVer version
        if: steps.changes.outputs.app == 'true'
        id: semver
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          SEMVER="${BASE_TAG}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "Calculated SemVer version: ${SEMVER} (${COMMIT_SHA})"

      - name: Log in to GHCR
        if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Build and push backend image
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.semver.outputs.version }}
            APP_COMMIT=${{ steps.semver.outputs.commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-backend:preprod-${{ steps.semver.outputs.commit }}

      - name: Build and push frontend image
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
            VITE_OTEL_EXPORTER_URL=${{ env.VITE_OTEL_EXPORTER_URL }}
            VITE_APP_ENV=${{ env.ENVIRONMENT }}
            VITE_PLAUSIBLE_DOMAIN=${{ env.VITE_PLAUSIBLE_DOMAIN }}
            VITE_PLAUSIBLE_API_HOST=${{ env.VITE_PLAUSIBLE_API_HOST }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-frontend:preprod-${{ steps.semver.outputs.commit }}

      - name: Build and push landing image
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.16.0
        with:
          context: landing
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod
            ghcr.io/${{ github.repository_owner }}/nanko-landing:preprod-${{ steps.semver.outputs.commit }}

      - name: Wait for Preprod deployment (Watchtower polling)
        if: steps.changes.outputs.app == 'true'
        env:
          PREPROD_HTTP_USER: ${{ secrets.PREPROD_HTTP_USER }}
          PREPROD_HTTP_PASSWORD: ${{ secrets.PREPROD_HTTP_PASSWORD }}
        run: |
          EXPECTED_VERSION="${{ steps.semver.outputs.version }}"
          echo "Waiting for preprod (${PREPROD_VERSION_URL}) to serve version: ${EXPECTED_VERSION}"
          TIMEOUT=480
          ELAPSED=0
          INTERVAL=15

          CURL_AUTH_FLAG=()
          if [ -n "${PREPROD_HTTP_USER}" ] && [ -n "${PREPROD_HTTP_PASSWORD}" ]; then
            CURL_AUTH_FLAG=(-u "${PREPROD_HTTP_USER}:${PREPROD_HTTP_PASSWORD}")
          fi

          while [ $ELAPSED -lt $TIMEOUT ]; do
            CURRENT_VERSION=$(curl -s "${CURL_AUTH_FLAG[@]}" --connect-timeout 5 --max-time 10 "${PREPROD_VERSION_URL}" | jq -r '.version // empty' 2>/dev/null || echo "")
            echo "[$(date +'%T')] Current preprod version: '${CURRENT_VERSION}' (expected: '${EXPECTED_VERSION}')"

            if [ "$CURRENT_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "✅ Preprod is successfully deployed with version ${EXPECTED_VERSION}!"
              exit 0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout: Preprod did not update to version ${EXPECTED_VERSION} within ${TIMEOUT} seconds."
          exit 1

      - name: Set up pnpm
        if: steps.changes.outputs.app == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Set up Node.js
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.changes.outputs.app == 'true'
        run: pnpm --filter tests-e2e exec playwright install --with-deps chromium

      - name: Run E2E tests against preprod
        if: steps.changes.outputs.app == 'true'
        env:
          APP_BASE_URL: ${{ env.APP_BASE_URL }}
          API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PREPROD_HTTP_USER: ${{ secrets.PREPROD_HTTP_USER }}
          PREPROD_HTTP_PASSWORD: ${{ secrets.PREPROD_HTTP_PASSWORD }}
        run: pnpm --filter tests-e2e exec playwright test

      - name: Upload Playwright report on failure
        if: steps.changes.outputs.app == 'true' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-preprod
          path: tests-e2e/playwright-report/
          retention-days: 7
