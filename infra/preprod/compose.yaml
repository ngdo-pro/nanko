services:
  postgres:
    image: postgres:16-alpine
    container_name: nanko-preprod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nanko
    volumes:
      - nanko-preprod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanko -d nanko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/ngdo-pro/nanko-backend:preprod
    container_name: nanko-preprod-backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://nanko:${POSTGRES_PASSWORD}@postgres:5432/nanko?serverVersion=16&charset=utf8
      KEYCLOAK_JWKS_URL: https://auth.preprod.nanko.dev/realms/nanko/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: https://auth.preprod.nanko.dev/realms/nanko
      SERVER_NAME: ":80"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$|^https://[a-z0-9-]+\.preprod\.nanko\.dev$'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: nanko-backend
      OTEL_RESOURCE_ATTRIBUTES: service.name=nanko-backend,deployment.environment=preprod
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      caddy: api.preprod.nanko.dev
      caddy.encode: gzip
      caddy.basic_auth: "/*"
      caddy.basic_auth.${PREPROD_HTTP_USER:-nanko}: "${PREPROD_HTTP_HASH}"
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: DENY
      caddy.header.X-Robots-Tag: "noindex, nofollow"
    # Under caddy-docker-proxy, the `caddy.reverse_proxy` label above resolves
    # the upstream automatically by container IP -- there's no separate
    # Caddyfile to keep in sync anymore. `container_name` is kept only for
    # human-readable `docker ps`/`docker logs` disambiguation between preprod
    # and prod.
    networks:
      default: {}
      edge: {}

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: nanko-preprod-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nanko
      KC_DB_USERNAME: nanko
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: https://auth.preprod.nanko.dev
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://signoz-otel-collector:4317
      KC_TRACING_RESOURCE_ATTRIBUTES: service.name=nanko-keycloak,deployment.environment=preprod
      KC_METRICS_ENABLED: "true"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      caddy: auth.preprod.nanko.dev
      caddy.encode: gzip
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      caddy.header.X-Content-Type-Options: nosniff
    networks:
      default: {}
      edge: {}

  frontend:
    image: ghcr.io/ngdo-pro/nanko-frontend:preprod
    container_name: nanko-preprod-frontend
    restart: unless-stopped
    networks:
      edge: {}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      caddy: app.preprod.nanko.dev
      caddy.encode: gzip
      caddy.basic_auth: "/*"
      caddy.basic_auth.${PREPROD_HTTP_USER:-nanko}: "${PREPROD_HTTP_HASH}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: DENY
      caddy.header.X-Robots-Tag: "noindex, nofollow"

  landing:
    image: ghcr.io/ngdo-pro/nanko-landing:preprod
    container_name: nanko-preprod-landing
    restart: unless-stopped
    networks:
      edge: {}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      caddy: www.preprod.nanko.dev
      caddy.encode: gzip
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: DENY
      caddy.header.X-Robots-Tag: "noindex, nofollow"

networks:
  edge:
    external: true

volumes:
  nanko-preprod-postgres-data:
