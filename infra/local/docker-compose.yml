services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanko
      POSTGRES_PASSWORD: nanko
      POSTGRES_DB: nanko
    ports:
      - "5432:5432"
    volumes:
      - nanko-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanko -d nanko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nanko-postgres-data:
