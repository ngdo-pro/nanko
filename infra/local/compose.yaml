services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanko
      POSTGRES_PASSWORD: nanko
      POSTGRES_DB: nanko
    ports:
      # Non-default host port: this is a work laptop that may run other
      # projects' postgres/backend/frontend on the usual 5432/8000/5173.
      - "45432:5432"
    volumes:
      - nanko-postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanko -d nanko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      target: dev
    environment:
      APP_ENV: dev
      # Same value as backend/.env.dev (committed, dev-only) -- not a secret.
      APP_SECRET: 0b2a39f9e7175ccce856ec0da95c65b6
      DATABASE_URL: postgresql://nanko:nanko@postgres:5432/nanko?serverVersion=16&charset=utf8
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/nanko/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:48080/realms/nanko
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: nanko-backend
      OTEL_RESOURCE_ATTRIBUTES: service.name=nanko-backend,deployment.environment=local
    ports:
      - "48000:8000"
    volumes:
      - ../../backend:/app
      # Named volume so the host (which may have no PHP/Composer at all) never
      # shadows the vendor/ that `composer install` creates inside the
      # container; it persists across `up`/`down` instead of reinstalling
      # from scratch every time.
      - nanko-backend-vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nanko
      KC_DB_USERNAME: nanko
      KC_DB_PASSWORD: nanko
      KC_DB_SCHEMA: keycloak
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: "http://otel-collector:4317"
      KC_TRACING_RESOURCE_ATTRIBUTES: "service.name=nanko-keycloak,deployment.environment=local"
      KC_METRICS_ENABLED: "true"
    ports:
      - "48080:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      # Repo root, not frontend/ -- see the comment atop frontend/Dockerfile:
      # the pnpm workspace install needs every package's package.json.
      context: ../..
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:48000
      VITE_KEYCLOAK_URL: http://localhost:48080
      VITE_KEYCLOAK_REALM: nanko
      VITE_KEYCLOAK_CLIENT_ID: nanko-web
      VITE_OTEL_EXPORTER_URL: ""
      VITE_OTEL_SERVICE_NAME: nanko-frontend
      VITE_APP_ENV: local
    ports:
      - "45173:5173"
    volumes:
      - ../..:/workspace
      # Named volumes for the same reason as the backend's vendor/ above:
      # the host may have no Node/pnpm, so node_modules must live entirely
      # inside the container rather than be shadowed by the bind mount.
      - nanko-frontend-node-modules:/workspace/node_modules
      - nanko-frontend-app-node-modules:/workspace/frontend/node_modules
      # pnpm's content-addressable store defaults to <workspace-root>/.pnpm-store,
      # which without --store-dir would land inside the bind-mounted repo root
      # on the host (see frontend/Dockerfile's CMD).
      - nanko-pnpm-store:/pnpm-store
    depends_on:
      - backend
      - keycloak

  landing:
    build:
      context: ../../landing
    ports:
      - "45174:8080"
    volumes:
      - ../../landing:/srv

volumes:
  nanko-postgres-data:
  nanko-backend-vendor:
  nanko-frontend-node-modules:
  nanko-frontend-app-node-modules:
  nanko-pnpm-store:
